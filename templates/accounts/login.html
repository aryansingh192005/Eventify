{% extends "base/base.html" %}


{% load static %}



{% block title %}
Login | Eventify
{% endblock %}





{% block auth_css %}

<link rel="stylesheet"
      href="{% static 'css/auth.css' %}">

{% endblock %}







{% block content %}



<section class="auth-page">



<div class="auth-container">



<div class="auth-card">





<div class="auth-brand">


<div class="auth-logo">


<i class="bi bi-person-fill"></i>


</div>



<h2>

Welcome Back

</h2>



<p>

Login to continue your Eventify journey.

</p>


</div>









<form method="POST">


{% csrf_token %}




<div class="form-floating mb-3">


<input
type="text"
name="username"
class="form-control"
id="username"
placeholder="Username"
required>


<label for="username">

Username

</label>


</div>







<div class="form-floating mb-4">


<input
type="password"
name="password"
class="form-control"
id="password"
placeholder="Password"
required>


<label for="password">

Password

</label>


</div>






<button
type="submit"
class="auth-btn">


<i class="bi bi-box-arrow-in-right me-2"></i>


Login


</button>





</form>







<div class="auth-divider">

</div>






<div class="auth-footer">


Don't have an account?


<a href="{% url 'register' %}">

Create account

</a>


</div>





</div>


</div>


</section>




{% endblock %}
